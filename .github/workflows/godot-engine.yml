# محرك Godot مصغّر للويب (2D بس، بدون الوحدات اللي ما نحتاجها) — حتى حزم الألعاب تصير أصغر بكثير.
# ينبني يدوياً مرة وحدة لكل نسخة Godot، وينحفظ بإصدار «packs» باسم godot-web-2d-<version>.zip.
# بعدها workflow «Game Packs» يستعمله بدل القالب الرسمي إذا موجود.
name: Godot Engine (2D web template)

on:
  workflow_dispatch:
    inputs:
      suffix:
        description: 'لاحقة اسم الملف (تجربة جديدة ما تمسح المجرّبة) — مثلاً b'
        default: ''
      extra:
        description: 'خيارات scons إضافية'
        default: ''

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4.1
  EMSDK_VERSION: 3.1.64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github
      - uses: actions/checkout@v7
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_VERSION }}-stable
          path: godot
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: pip install scons==4.9.1
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: بناء القالب
        working-directory: godot
        env:
          SUFFIX: ${{ inputs.suffix }}
        # نشيل 3D والوحدات اللي ألعابنا ما تحتاجها، ونخلي: GDScript، النص العربي (text_server_adv + freetype)، فيزياء 2D، PNG/WebP
        run: |
          scons platform=web target=template_release threads=no production=yes optimize=size \
            disable_3d=yes deprecated=no \
            module_basis_universal_enabled=no module_bmp_enabled=no module_camera_enabled=no module_csg_enabled=no \
            module_dds_enabled=no module_enet_enabled=no module_etcpak_enabled=no module_fbx_enabled=no module_gltf_enabled=no \
            module_gridmap_enabled=no module_hdr_enabled=no module_jsonrpc_enabled=no module_ktx_enabled=no \
            module_meshoptimizer_enabled=no module_minimp3_enabled=no module_mobile_vr_enabled=no module_msdfgen_enabled=no \
            module_multiplayer_enabled=no module_noise_enabled=no module_ogg_enabled=no module_openxr_enabled=no \
            module_raycast_enabled=no module_squish_enabled=no module_svg_enabled=no module_tga_enabled=no \
            module_theora_enabled=no module_tinyexr_enabled=no module_upnp_enabled=no module_vhacd_enabled=no \
            module_vorbis_enabled=no module_webrtc_enabled=no module_websocket_enabled=no module_webxr_enabled=no \
            module_xatlas_unwrap_enabled=no module_lightmapper_rd_enabled=no module_interactive_music_enabled=no \
            module_jolt_physics_enabled=no module_godot_physics_3d_enabled=no module_cvtt_enabled=no \
            module_astcenc_enabled=no module_navigation_enabled=no ${{ inputs.extra }}
          ls -la bin
          unzip -l bin/godot.web.template_release.wasm32.nothreads.zip
          cp bin/godot.web.template_release.wasm32.nothreads.zip "$RUNNER_WORKSPACE/godot-web-2d-${GODOT_VERSION}${SUFFIX:+-$SUFFIX}.zip"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: packs
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: ${{ runner.workspace }}/godot-web-2d-*.zip
